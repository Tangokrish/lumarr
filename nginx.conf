map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location /custom/ {
        alias /usr/share/nginx/custom/;
        add_header Cache-Control "no-cache";
    }

    # Sidebar logo
    location = /logo_full.svg {
        root /usr/share/nginx/custom;
        try_files /logo.svg =404;
        types { }
        default_type image/svg+xml;
        add_header Cache-Control "no-cache";
    }

    # Login page logo
    location = /logo_stacked.svg {
        root /usr/share/nginx/custom;
        try_files /logo_stacked.svg =404;
        types { }
        default_type image/svg+xml;
        add_header Cache-Control "no-cache";
    }

    # Small icon and tab icon
    location ~ ^/(os_icon\.svg|favicon\.ico)$ {
        root /usr/share/nginx/custom;
        try_files /icon.svg =404;
        types { }
        default_type image/svg+xml;
        add_header Cache-Control "no-cache";
    }

    # iPhone home-screen icon
    location = /apple-touch-icon.png {
        root /usr/share/nginx/custom;
        try_files /apple-touch-icon.png =404;
        add_header Cache-Control "no-cache";
    }

    location = /site.webmanifest {
        root /usr/share/nginx/custom;
        try_files /site.webmanifest =404;
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://seerr:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";

        sub_filter '</head>' '<link rel="stylesheet" href="/custom/custom.css"><meta name="apple-mobile-web-app-title" content="Lumarr"></head>';
        sub_filter 'type="image/png" sizes="32x32" href="/favicon-32x32.png"' 'type="image/svg+xml" href="/custom/icon.svg"';
        sub_filter 'type="image/png" sizes="16x16" href="/favicon-16x16.png"' 'type="image/svg+xml" href="/custom/icon.svg"';
        sub_filter 'content="Seerr"' 'content="Lumarr"';
        sub_filter_once off;
    }
}
